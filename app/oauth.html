<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Connecting your music…</title>
<link rel="icon" href="/assets/img/logo.png" type="image/png">
<link rel="stylesheet" href="/assets/shared.css">
<script src="/assets/i18n.js"></script>
<style>
  :root{--bg:#121211;--surface:#1a1a18;--text:#ded9d0;--muted:#9d988e;--accent:#ff6a45;--line:#2b2b28}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
    display:grid;place-items:center;text-align:center;padding:24px}
  .box{max-width:420px}
  .logo{width:74px;height:auto;margin:0 auto 22px;border-radius:20px;display:block}
  h1{font-size:1.25rem;margin:0 0 10px;font-weight:700}
  p{margin:0;color:var(--muted);font-size:.92rem;line-height:1.5}
  .sp{width:34px;height:34px;margin:0 auto 20px;border-radius:50%;
    border:3px solid var(--line);border-top-color:var(--accent);animation:sp .9s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .err{color:#ff7a68}
  .ok{color:#4fb87c}
  a{color:var(--accent)}
</style>
</head>
<body>
<div class="box">
  <img class="logo" src="/assets/img/logo.png" alt="Gym Badge">
  <div class="sp" id="sp"></div>
  <h1 id="title">Finishing your music sign in…</h1>
  <p id="msg">Hold on while we connect your account.</p>
</div>
<script>
(function () {
  var q = {};
  (location.search || "").replace(/^\?/, "").split("&").forEach(function (kv) {
    if (!kv) return;
    var i = kv.indexOf("=");
    var k = decodeURIComponent(i < 0 ? kv : kv.slice(0, i));
    var v = i < 0 ? "" : decodeURIComponent(kv.slice(i + 1).replace(/\+/g, " "));
    q[k] = v;
  });

  var title = document.getElementById("title");
  var msg = document.getElementById("msg");
  var sp = document.getElementById("sp");

  function post(payload) {
    try {
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage(payload, location.origin);
        return true;
      }
    } catch (e) {}
    return false;
  }

  if (q.error) {
    sp.style.display = "none";
    title.textContent = "Sign in cancelled";
    msg.className = "err";
    msg.textContent = q.error_description || q.error || "The music service did not complete the sign in.";
    post({ source: "gb-music", error: q.error, message: msg.textContent });
    return;
  }

  if (!q.code) {
    sp.style.display = "none";
    title.textContent = "Nothing to confirm";
    msg.className = "err";
    msg.textContent = "No authorisation code was returned. Close this window and try again.";
    post({ source: "gb-music", error: "no_code", message: msg.textContent });
    return;
  }

  var sent = post({ source: "gb-music", code: q.code, state: q.state || "" });
  if (sent) {
    msg.className = "ok";
    msg.textContent = "Connected. You can close this window.";
    setTimeout(function () { try { window.close(); } catch (e) {} }, 700);
  } else {
    // No opener (the user opened the link directly) — send them back to the app.
    sp.style.display = "none";
    msg.innerHTML = 'Connected. <a href="/app/#/settings">Return to Gym Badge</a>';
  }
})();
</script>
</body>
</html>
